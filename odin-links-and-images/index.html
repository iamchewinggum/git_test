<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Homepage</h1>
    <!-- opening tab
     made up of two parts
     a name
     a value
     however, not all attributes require a value
    
    href attribute -->
    <a href="https://www.theodinproject.com/about">About The Odin Project</a>

    <!-- by default, any text wrapped wiht an 
     anchor tag without an href
     attribute will look like plain text
     
     if the href attribute is present
     the browser will give the text a blue
     color and underline it to signify it is a link
     
     the above opens links in the same tab as
     the webpage containing them
     default behavior of most browsers 
     can be changed relatively easily
     all we need is another attribute

     target attribute

     target specifies where the linked 
     resource will be opened

     if it is not present, then by default it 
     will take on the _self value which 
     opens the link in the current tab 

     to open the link in a new tab or window
     )depends on the browser settings)
     you can set it to _blank 
     -->

         <a href="https://www.theodinproject.com/about" target="_blank" rel="noreferrer">About The Odin Project</a>

         <!-- absoulte links
          links to pages on other websites on 
          internet
          
          a typical absolute link will be 
          made up of the following parts
          scheme://domain/path
          
          an absolute link will always conatin the scheme
          and domain of the destination 
          
          relative links 
          links to other pages within our 
          own website 
          
          relative lins do not include the domain name
          since its is another page on the same
          site
          assumes the domain name wil be the same as 
          the page we created the link on 
          
          relateive links only include the file path
          to the other page
          
          
          to display an image
          in HTML
          we use the <img> element
          
          void elemtns do not need a closing tag
          instead of wrapping content
          src attribute which tell
          the browser where the image file is 
          located
          
          example 
           <img src="https://www.theodinproject.com/mstile-310x310.png">



           to go to the parent directory we need 
           to use two dots in the relative filepath
           like this ../
           <img src"../images/dog.jpg"

           besides
           Alt attribute

           besides the src attribute
           every image element should also have an alt attribute

           the alt attribute is used to describe an image
           used in place of the image if it cannnot be loaded 

           also used iwth screen readers to describe what the image
           is to visually imparied

           image size attributes
           while not strictly required
           specifying height and width attributes
           in image tags helps the browser layout the page
           without causeing the page to jump and flash

           good habit to always specify these attributes 
           on every image
           even when the image is correct size or 
           when you are using CSS to modify it 

           this prevents content jumping as images load 
           
          -->
</body>
</html>
